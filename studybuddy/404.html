<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StudyBuddy</title>
  <script>
    // GitHub Pages SPA redirect: converts the path into a query parameter
    // so index.html can restore it. This handles direct navigation and
    // page refreshes on path-based routes.
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    window.location.replace(
      window.location.origin + '/?p=' + encodeURIComponent(path + search + hash)
    );
  </script>
</head>
<body></body>
</html>
