<!DOCTYPE html>
<html>
<head>
  <script src="/sublink-guard.js"></script>
  <base href="/dermatriage/">
  <script>
    (function() {
      var b = document.querySelector('base');
      if (!b) {
        b = document.createElement('base');
        document.head.appendChild(b);
      }
      var h = (location.hostname || '').toLowerCase();
      var p = location.pathname || '';
      if (h === 'kiruu.xyz' || h === 'www.kiruu.xyz' || h.endsWith('.github.io') || p.indexOf('/dermatriage') !== -1) {
        b.href = '/dermatriage/';
      } else {
        b.href = '/';
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Dermatriage: Dual-Branch CNN-ViT Cross-Attention Skin Lesion & Exanthem Clinical Decision Support">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dermatriage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dermatriage - Exanthem Clinical Triage</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      overflow: hidden;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      transition: opacity .3s ease;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #boot i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0d9488;
      box-shadow: 0 0 20px 8px rgba(13, 148, 136, .55);
      animation: boot-pulse 1.2s ease-in-out infinite;
      margin-bottom: 16px;
    }
    @keyframes boot-pulse {
      50% {
        transform: scale(1.6);
        opacity: .7;
      }
    }
  </style>
</head>
<body>
  <div id="boot">
    <i></i>
    <span style="font-size: 13px; letter-spacing: 0.5px; font-weight: 500;">Initializing Dermatriage Clinical Engine...</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
