<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to TAWIR Beta</title>
  <script>
    (function () {
      var suffix = window.location.search + window.location.hash;
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 1000);
      fetch("https://tawir.kiruu.xyz/sublink-guard.js", {
        method: "HEAD",
        mode: "no-cors",
        cache: "no-store",
        signal: ctrl.signal
      }).then(function () {
        clearTimeout(timer);
        window.location.replace("https://tawir.kiruu.xyz/beta/" + suffix);
      }).catch(function () {
        clearTimeout(timer);
        window.location.replace("/tawir/beta/" + suffix);
      });
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/tawir/beta/">TAWIR Beta</a>&hellip;</p>
</body>
</html>
