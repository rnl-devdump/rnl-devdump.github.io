<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/sublink-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAWIR Conversations — Live Model Monitor</title>
  <link rel="icon" type="image/png" href="/tawir-webapp/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-serif: "Newsreader", Georgia, Cambria, serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;

      /* Claude Warm Light Mode */
      --bg-page: #FAF9F5;
      --bg-card: #FFFFFF;
      --bg-surface: #F3F1EA;
      --bg-surface-hover: #ECE9DF;
      --bg-user-bubble: #F0EDE5;
      --border-subtle: #E8E5DC;
      --border-strong: #D6D2C4;
      
      /* Claude Signature Accent */
      --accent: #D97757;
      --accent-hover: #C56545;
      --accent-tint: #FDF4F0;
      --accent-border: #F3C9BA;

      /* Typography */
      --text-main: #1F1E1D;
      --text-secondary: #66645E;
      --text-muted: #8F8D86;
      --text-inverse: #FFFFFF;

      --badge-bg: #EFECE4;
      --badge-text: #4D4B46;
      
      --status-live: #2E7D32;
      --status-live-bg: #E8F5E9;

      --shadow-sm: 0 1px 2px rgba(31, 30, 29, 0.04);
      --shadow-md: 0 4px 12px rgba(31, 30, 29, 0.06);
    }

    [data-theme="dark"] {
      --bg-page: #161514;
      --bg-card: #1F1E1B;
      --bg-surface: #272622;
      --bg-surface-hover: #31302A;
      --bg-user-bubble: #282723;
      --border-subtle: #2F2E29;
      --border-strong: #3F3D36;

      --accent: #E08264;
      --accent-hover: #EC9477;
      --accent-tint: #2B211D;
      --accent-border: #52372E;

      --text-main: #EDEBE6;
      --text-secondary: #A3A199;
      --text-muted: #73716A;
      --text-inverse: #161514;

      --badge-bg: #2C2B26;
      --badge-text: #CBC8BF;

      --status-live: #66BB6A;
      --status-live-bg: #1B2E1C;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.55;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Top Navigation Header */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 17px;
      box-shadow: 0 2px 5px rgba(217, 119, 87, 0.3);
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .brand-sep {
      color: var(--text-muted);
      font-weight: 300;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--status-live-bg);
      color: var(--status-live);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status-live);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Top Stats Strip */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-surface);
      border-color: var(--border-strong);
    }

    .btn-accent {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-accent:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Stats Bar below header */
    .metrics-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .metric-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-label {
      color: var(--text-muted);
    }

    .metric-value {
      font-weight: 600;
      color: var(--text-main);
    }

    /* Master-Detail Layout */
    .main-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 95px);
      overflow: hidden;
    }

    /* Left Sidebar: Session List */
    .sidebar {
      width: 380px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-search-box {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      width: 14px;
      height: 14px;
    }

    .search-input {
      width: 100%;
      padding: 8px 10px 8px 32px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--bg-card);
    }

    .convo-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .convo-card {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.15s ease;
      position: relative;
    }

    .convo-card:hover {
      background: var(--bg-surface);
    }

    .convo-card.active {
      background: var(--bg-surface);
      border-color: var(--border-subtle);
      border-left: 3px solid var(--accent);
    }

    .convo-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .convo-card-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .convo-card-query {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .convo-card-preview {
      font-size: 12px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .convo-card-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-pill {
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tag-pill-search {
      background: var(--accent-tint);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    /* Right Main Inspector */
    .inspector {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-page);
      overflow-y: auto;
      padding: 28px 36px;
    }

    .inspector-content {
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }

    .convo-meta-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }

    .convo-id-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--badge-bg);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .convo-time-detail {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* User Message Card */
    .user-bubble-container {
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .bubble-author {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .user-bubble {
      background: var(--bg-user-bubble);
      border: 1px solid var(--border-subtle);
      border-radius: 14px 14px 4px 14px;
      padding: 14px 18px;
      color: var(--text-main);
      font-size: 14px;
      max-width: 85%;
      box-shadow: var(--shadow-sm);
      word-break: break-word;
    }

    /* Assistant Inspector Section */
    .assistant-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .assistant-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 500;
      color: var(--text-main);
    }

    .assistant-badge-icon {
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
    }

    /* Thinking Accordion (Claude style collapsible thought process) */
    .thinking-accordion {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
    }

    .thinking-accordion-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: var(--bg-surface);
      transition: background 0.15s ease;
    }

    .thinking-accordion-header:hover {
      background: var(--bg-surface-hover);
    }

    .thinking-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .thinking-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-tint);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .thinking-chevron {
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .thinking-accordion.open .thinking-chevron {
      transform: rotate(180deg);
    }

    .thinking-body {
      display: none;
      padding: 14px 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .thinking-accordion.open .thinking-body {
      display: block;
    }

    .thought-step {
      margin-bottom: 12px;
      padding-left: 10px;
      border-left: 2px solid var(--accent);
    }

    .thought-step:last-child {
      margin-bottom: 0;
    }

    .tool-execution-card {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .tool-exec-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }

    /* Model Response Bubble / Article */
    .response-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
    }

    .response-text {
      font-size: 14.5px;
      color: var(--text-main);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .response-footer {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .sources-list {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .source-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .source-pill:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-tint);
    }

    /* Empty state */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    .empty-state-icon {
      font-size: 36px;
      margin-bottom: 12px;
      color: var(--border-strong);
    }

    .empty-state h3 {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 6px;
    }
  </style>
</head>
<body data-theme="light">

  <!-- Header -->
  <header>
    <div class="brand-group">
      <div class="brand-logo">T</div>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="brand-title">Tawir Conversations</span>
          <span class="brand-sep">/</span>
          <span class="brand-subtitle">Model Live Monitor</span>
        </div>
      </div>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="liveText">LIVE POLLING</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" id="btnRefresh" title="Refresh Now">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-1.19"/></svg>
        <span>Refresh</span>
      </button>

      <button class="btn" id="btnToggleAuto">
        <span id="autoPollingStatus">Pause Auto (5s)</span>
      </button>

      <button class="btn" id="btnExportJson" title="Export as JSON">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span>Export</span>
      </button>

      <button class="btn" id="btnThemeToggle" title="Toggle Light/Dark Theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Metrics Bar -->
  <div class="metrics-bar">
    <div class="metric-item">
      <span class="metric-label">Total Queries:</span>
      <span class="metric-value" id="statTotalQueries">0</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Web Searches:</span>
      <span class="metric-value" id="statTotalSearches">0</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Avg Generation Latency:</span>
      <span class="metric-value" id="statAvgLatency">0 ms</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Active Model:</span>
      <span class="metric-value">Pangasinan LLaMA 3.1 8B (Q8_0) + Qwen3-4B</span>
    </div>
    <div class="metric-item" style="margin-left: auto;">
      <span class="metric-label">Last Synced:</span>
      <span class="metric-value" id="statLastSync">Just now</span>
    </div>
  </div>

  <!-- Main Split Content -->
  <div class="main-workspace">
    <!-- Left Conversation List -->
    <div class="sidebar">
      <div class="sidebar-search-box">
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search conversations...">
        </div>
      </div>
      <div class="convo-list" id="convoListContainer">
        <!-- Rendered session cards -->
      </div>
    </div>

    <!-- Right Inspector Pane -->
    <div class="inspector" id="inspectorPane">
      <!-- Detailed selected conversation content -->
    </div>
  </div>

  <script>
    const API_ENDPOINT = "https://ocamporavenneil--pangasinan-agent-agent-web.modal.run/conversations";
    let conversations = [];
    let selectedConvoId = null;
    let autoPolling = true;
    let pollInterval = null;

    // Load initial theme from localStorage
    const savedTheme = localStorage.getItem("tawir_convo_theme") || "light";
    document.body.setAttribute("data-theme", savedTheme);
    document.getElementById("themeIcon").textContent = savedTheme === "dark" ? "☀️" : "🌙";

    // Theme Toggle
    document.getElementById("btnThemeToggle").addEventListener("click", () => {
      const current = document.body.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", next);
      localStorage.setItem("tawir_convo_theme", next);
      document.getElementById("themeIcon").textContent = next === "dark" ? "☀️" : "🌙";
    });

    // Format Relative Time
    function formatRelativeTime(isoString) {
      if (!isoString) return "";
      try {
        const date = new Date(isoString);
        const now = new Date();
        const diffSec = Math.floor((now - date) / 1000);

        if (diffSec < 45) return "Just now";
        if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
        if (diffSec < 86400) return `${Math.floor(diffSec / 3600)}h ago`;
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return isoString;
      }
    }

    // Fetch conversations from Modal backend
    async function fetchConversations(quiet = false) {
      const btn = document.getElementById("btnRefresh");
      if (!quiet) btn.classList.add("loading");

      try {
        const res = await fetch(API_ENDPOINT, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          conversations = data.conversations || [];
          
          // Update Stats
          const stats = data.stats || {};
          document.getElementById("statTotalQueries").textContent = stats.total_conversations || conversations.length;
          document.getElementById("statTotalSearches").textContent = stats.total_searches || 0;
          document.getElementById("statAvgLatency").textContent = `${stats.avg_duration_ms || 0} ms`;
          document.getElementById("statLastSync").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          renderConversationList();

          // Auto-select latest if none selected
          if (!selectedConvoId && conversations.length > 0) {
            selectConversation(conversations[0].id);
          } else if (selectedConvoId) {
            // Re-render currently selected
            const found = conversations.find(c => c.id === selectedConvoId);
            if (found) renderInspector(found);
          }
        }
      } catch (err) {
        console.warn("Failed to fetch conversations:", err);
      } finally {
        btn.classList.remove("loading");
      }
    }

    // Render Conversation List
    function renderConversationList() {
      const container = document.getElementById("convoListContainer");
      const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = conversations.filter(c => {
        if (!searchTerm) return true;
        const q = (c.user_message || "").toLowerCase();
        const r = (c.response_text || "").toLowerCase();
        return q.includes(searchTerm) || r.includes(searchTerm);
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">
            ${searchTerm ? 'No conversations match your search.' : 'No conversations recorded yet.<br><span style="font-size: 11px;">Chat with Tawir to see live logs!</span>'}
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const hasTools = c.tool_calls && c.tool_calls.length > 0;
        const hasThoughts = c.thoughts && c.thoughts.length > 0;
        const isSelected = c.id === selectedConvoId;
        const durationSec = c.duration_ms ? (c.duration_ms / 1000).toFixed(1) + "s" : null;

        return `
          <div class="convo-card ${isSelected ? 'active' : ''}" onclick="selectConversation('${c.id}')">
            <div class="convo-card-top">
              <span class="convo-card-time">${formatRelativeTime(c.timestamp)}</span>
              ${durationSec ? `<span style="font-size: 10.5px; color: var(--text-muted);">${durationSec}</span>` : ''}
            </div>
            <div class="convo-card-query">${escapeHtml(c.user_message || "Empty query")}</div>
            <div class="convo-card-preview">${escapeHtml(c.response_text || "No response")}</div>
            <div class="convo-card-tags">
              ${hasTools ? `<span class="tag-pill tag-pill-search">🔍 ${c.tool_calls.length} search</span>` : ''}
              ${hasThoughts ? `<span class="tag-pill">🧠 ${c.thoughts.length} thoughts</span>` : ''}
              ${c.sources && c.sources.length > 0 ? `<span class="tag-pill">🌐 ${c.sources.length} sources</span>` : ''}
            </div>
          </div>
        `;
      }).join("");
    }

    // Select Conversation
    function selectConversation(id) {
      selectedConvoId = id;
      renderConversationList();
      const convo = conversations.find(c => c.id === id);
      if (convo) {
        renderInspector(convo);
      }
    }

    // Render Inspector Details
    function renderInspector(c) {
      const pane = document.getElementById("inspectorPane");
      const hasThoughts = c.thoughts && c.thoughts.length > 0;
      const hasTools = c.tool_calls && c.tool_calls.length > 0;
      const hasSources = c.sources && c.sources.length > 0;

      pane.innerHTML = `
        <div class="inspector-content">
          <!-- Metadata Bar -->
          <div class="convo-meta-header">
            <div>
              <span class="convo-id-badge">ID: ${c.id}</span>
              <span style="margin-left: 8px; font-size: 12px; color: var(--text-muted);">${c.use_tools ? 'Web Tools ON' : 'Direct Answer'}</span>
            </div>
            <div class="convo-time-detail">
              <span>${new Date(c.timestamp).toLocaleString()}</span>
              ${c.duration_ms ? ` • <strong style="color: var(--text-main);">${c.duration_ms} ms</strong>` : ''}
            </div>
          </div>

          <!-- User Prompt -->
          <div class="user-bubble-container">
            <span class="bubble-author">User Query</span>
            <div class="user-bubble">
              ${escapeHtml(c.user_message || "")}
            </div>
          </div>

          <!-- Assistant Output -->
          <div class="assistant-section">
            <div class="assistant-header">
              <span class="assistant-badge-icon">✦</span>
              <span>Tawir (Pangasinan Model)</span>
            </div>

            <!-- Thinking & Tools Accordion -->
            ${(hasThoughts || hasTools) ? `
              <div class="thinking-accordion open" id="thinkingBox">
                <div class="thinking-accordion-header" onclick="toggleThinking()">
                  <div class="thinking-title">
                    <span>Reasoning & Research Process (Qwen3-4B)</span>
                    <span class="thinking-badge">${c.thoughts ? c.thoughts.length : 0} steps</span>
                  </div>
                  <div class="thinking-chevron">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                  </div>
                </div>
                <div class="thinking-body">
                  ${(c.thoughts || []).map((t, i) => `
                    <div class="thought-step">
                      <strong style="color: var(--text-main); font-size: 11px;">Step ${i + 1}:</strong> ${escapeHtml(t)}
                    </div>
                  `).join("")}

                  ${(c.tool_calls || []).map(tool => `
                    <div class="tool-execution-card">
                      <div class="tool-exec-title">⚡ Tool Invoked: ${escapeHtml(tool.name)}</div>
                      <div style="color: var(--text-main);">Query: "${escapeHtml(tool.input)}"</div>
                      ${tool.preview ? `<div style="color: var(--text-muted); font-size: 10px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Observation: ${escapeHtml(tool.preview)}</div>` : ''}
                    </div>
                  `).join("")}
                </div>
              </div>
            ` : ''}

            <!-- Response Card -->
            <div class="response-card">
              <div class="response-text">${escapeHtml(c.response_text || "")}</div>

              ${hasSources ? `
                <div style="margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border-subtle);">
                  <div style="font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">DISCOVERED CITATIONS & SOURCES</div>
                  <div class="sources-list">
                    ${c.sources.map(s => `
                      <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer" class="source-pill">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>${escapeHtml(s.title || s.url)}</span>
                      </a>
                    `).join("")}
                  </div>
                </div>
              ` : ''}

              <div class="response-footer">
                <div>
                  <span>Words: <strong>${(c.response_text || "").split(/\s+/).filter(Boolean).length}</strong></span>
                  <span style="margin: 0 8px;">•</span>
                  <span>Chars: <strong>${(c.response_text || "").length}</strong></span>
                </div>
                <button class="btn" style="padding: 3px 8px; font-size: 11px;" onclick="copyText('${escapeHtml(c.response_text || "")}')">
                  Copy Output
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleThinking() {
      const box = document.getElementById("thinkingBox");
      if (box) box.classList.toggle("open");
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt).then(() => {
        alert("Pangasinan response copied to clipboard!");
      });
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Auto-polling toggle
    document.getElementById("btnToggleAuto").addEventListener("click", () => {
      autoPolling = !autoPolling;
      const statusSpan = document.getElementById("autoPollingStatus");
      const liveText = document.getElementById("liveText");
      if (autoPolling) {
        statusSpan.textContent = "Pause Auto (5s)";
        liveText.textContent = "LIVE POLLING";
        startPolling();
      } else {
        statusSpan.textContent = "Resume Auto";
        liveText.textContent = "POLLING PAUSED";
        clearInterval(pollInterval);
      }
    });

    // Refresh button
    document.getElementById("btnRefresh").addEventListener("click", () => {
      fetchConversations(false);
    });

    // Search input
    document.getElementById("searchInput").addEventListener("input", () => {
      renderConversationList();
    });

    // Export JSON
    document.getElementById("btnExportJson").addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(conversations, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `tawir_conversations_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    function startPolling() {
      clearInterval(pollInterval);
      pollInterval = setInterval(() => {
        if (autoPolling) {
          fetchConversations(true);
        }
      }, 5000);
    }

    // Initial load
    fetchConversations(false);
    startPolling();
  </script>
</body>
</html>
