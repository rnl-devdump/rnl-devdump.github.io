<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting to Kiruu Console Conversations</title>
  <script>
    (function () {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 1000);
      fetch("https://console.kiruu.xyz/index.html", {
        method: "HEAD",
        mode: "no-cors",
        cache: "no-store",
        signal: ctrl.signal
      }).then(function () {
        clearTimeout(timer);
        window.location.replace("https://console.kiruu.xyz/#conversations");
      }).catch(function () {
        clearTimeout(timer);
        window.location.replace("/console/#conversations");
      });
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/console/#conversations">Kiruu Console &mdash; Conversations</a>&hellip;</p>
</body>
</html>
