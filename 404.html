<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting &mdash; The Kiruu</title>
  <script>
    (function () {
      var host = (window.location.hostname || "").toLowerCase();
      var path = window.location.pathname || "/";
      var search = window.location.search || "";
      var hash = window.location.hash || "";

      var SUBLINK_REDIRECTS = {
        "dashboard": "https://console.kiruu.xyz",
        "console": "https://console.kiruu.xyz",
        "tawir-convo": "https://console.kiruu.xyz/#conversations",
        "tawir-beta": "https://tawir.kiruu.xyz/beta/",
        "tawir-dev": "https://tawir.kiruu.xyz/beta/",
        "tawir": "https://tawir.kiruu.xyz",
        "vl-assist": "https://vl-assist.kiruu.xyz",
        "anvil": "https://anvil.kiruu.xyz",
        "studybuddy": "https://anvil.kiruu.xyz",
        "asksight": "https://asksight.kiruu.xyz",
        "anime": "https://anime.kiruu.xyz",
        "movie": "https://movie.kiruu.xyz",
        "chess": "https://chess.kiruu.xyz",
        "vibe": "https://vibe.kiruu.xyz",
        "dataset": "https://dataset.kiruu.xyz",
        "validation": "https://validation.kiruu.xyz",
        "bill": "https://bill.kiruu.xyz",
        "directory": "https://directory.kiruu.xyz",
        "forum": "https://forum.kiruu.xyz",
        "faerie": "https://faerie.kiruu.xyz",
        "letter": "https://letter.kiruu.xyz",
        "letterx": "https://letterx.kiruu.xyz",
        "letterhelper": "https://letterhelper.kiruu.xyz"
      };

      var segments = path.replace(/^\/+|\/+$/g, "").split("/");
      var firstSeg = (segments[0] || "").toLowerCase();

      if (
        (host === "kiruu.xyz" || host === "www.kiruu.xyz" || host === "rnl-devdump.github.io") &&
        firstSeg &&
        SUBLINK_REDIRECTS[firstSeg]
      ) {
        var base = SUBLINK_REDIRECTS[firstSeg];
        var rest = segments.slice(1).join("/");
        var dest = base;
        if (firstSeg !== "tawir-convo") {
          var suffix = rest ? "/" + rest : "/";
          dest = base.replace(/\/+$/, "") + suffix + search + hash;
        }
        var fallback = firstSeg === "tawir-convo"
          ? "/console/#conversations"
          : (firstSeg === "tawir-beta" || firstSeg === "tawir-dev")
          ? "/tawir/beta/" + search + hash
          : "/" + firstSeg + "/" + (rest ? rest + "/" : "") + search + hash;

        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, 1000);
        fetch(new URL(base).origin + "/sublink-guard.js", {
          method: "HEAD",
          mode: "no-cors",
          cache: "no-store",
          signal: ctrl.signal
        }).then(function () {
          clearTimeout(timer);
          window.location.replace(dest);
        }).catch(function () {
          clearTimeout(timer);
          window.location.replace(fallback);
        });
        return;
      }

      if (host === "letter.kiruu.xyz" || host === "letterx.kiruu.xyz" || firstSeg === "letter" || firstSeg === "letterx") {
        sessionStorage.setItem("__kiruu_spa_redirect", path + search + hash);
        var spaRoot = (host === "letter.kiruu.xyz" || host === "letterx.kiruu.xyz") ? "/" : "/" + firstSeg + "/";
        window.location.replace(spaRoot);
        return;
      }

      window.location.replace("https://kiruu.xyz/");
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; background: #0b0f17; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
  <p>Redirecting&hellip;</p>
</body>
</html>
