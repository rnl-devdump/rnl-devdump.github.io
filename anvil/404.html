<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Anvil</title>
  <script>
    // GitHub Pages SPA redirect: preserves subpaths for repo-based deployments
    // while redirecting cleanly on custom domains.
    var l = window.location;
    var pathSegments = l.pathname.split('/').filter(Boolean);
    var isUserRepo = l.hostname.endsWith('github.io') && pathSegments.length > 0;
    var repoPrefix = isUserRepo ? '/' + pathSegments[0] : '';
    var redirectPath = isUserRepo ? '/' + pathSegments.slice(1).join('/') : l.pathname;

    l.replace(
      l.origin + repoPrefix + '/?p=' + encodeURIComponent(redirectPath + l.search + l.hash)
    );
  </script>
</head>
<body></body>
</html>
