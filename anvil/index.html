<!DOCTYPE html>
<html>
<head>
  <script>
    (function() {
      var b = document.createElement('base');
      var h = (location.hostname || '').toLowerCase();
      b.href = (h === 'kiruu.xyz' || h === 'www.kiruu.xyz' || h.endsWith('.github.io')) ? '/anvil/' : '/';
      document.head.appendChild(b);
    })();
  </script>

  <!-- Frame-busting clickjacking defense for static hosts (GitHub Pages) -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }
    // Clear stale portal cache that could block Anvil when masterSwitch is off
    try {
      ['kiruu_services_status', 'kiruu_sublinks_status'].forEach(function(key) {
        var raw = localStorage.getItem(key);
        if (raw) {
          var parsed = JSON.parse(raw);
          var anvilCfg = (parsed.services && parsed.services.anvil) || (parsed.sublinks && parsed.sublinks.anvil);
          if (!anvilCfg || anvilCfg.enabled !== false) {
            localStorage.removeItem(key);
          }
        }
      });
    } catch (_) {}
  </script>
  <script src="sublink-guard.js?v=20261110"></script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Where knowledge is forged through learning. Upload lecture notes, chat with a grounded tutor, build flashcards, take quizzes, and track your progress.">
  <meta name="theme-color" content="#5146E5">

  <!-- Content Security Policy for Flutter Web & CanvasKit -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://www.gstatic.com https://apis.google.com https://unpkg.com; worker-src 'self' blob:; connect-src 'self' https: wss: http://localhost:8000 http://127.0.0.1:8000 blob: data:; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:;">

  <!-- Open Graph -->
  <meta property="og:title" content="Anvil">
  <meta property="og:description" content="Where knowledge is forged through learning. A citation-grounded study companion.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rnl-devdump.github.io/anvil/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anvil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anvil</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading indicator while Flutter initializes */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #F4EFE4;
      font-family: 'Inter', system-ui, sans-serif;
      color: #6C6A68;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .loading { background: #0D1014; color: #A7A29A; }
    }
    .loading-spinner {
      width: 28px; height: 28px;
      border: 3px solid #E3DACB;
      border-top-color: #5146E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @media (prefers-color-scheme: dark) {
      .loading-spinner { border-color: #2A3039; border-top-color: #8E88FF; }
    }
    .loading-notice {
      max-width: 420px;
      margin-top: 8px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(242, 210, 75, 0.14);
      border: 1px solid rgba(242, 210, 75, 0.4);
      font-size: 13px;
      line-height: 1.45;
      color: #17181D;
    }
    @media (prefers-color-scheme: dark) {
      .loading-notice {
        background: rgba(230, 196, 81, 0.12);
        border-color: rgba(230, 196, 81, 0.35);
        color: #F3EFE6;
      }
    }
    .loading-retry {
      display: none;
      margin-top: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #8E88FF;
      background: transparent;
      color: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <span>Loading Anvil…</span>
    <div class="loading-notice">
      <strong>Free Serverless GPU Volume:</strong> We are using a free serverless GPU volume so it needs a cold start when waking from idle (typically 30–60 seconds).
    </div>
    <button class="loading-retry" id="loading-retry" type="button">
      Taking longer than expected? Reload fresh
    </button>
  </div>

  <script>
    // Restore path after 404.html SPA redirect with boundary verification
    (function() {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('p');
      if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
        try {
          var basePath = new URL(document.baseURI).pathname.replace(/\/$/, '');
          var decoded = decodeURIComponent(redirect);
          var target = (basePath && !decoded.startsWith(basePath))
            ? (basePath + '/#' + decoded)
            : decoded;
          window.history.replaceState(null, '', target);
        } catch (_) {}
      }
    })();

    function dismissLoading() {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    }

    window.addEventListener('flutter-first-frame', dismissLoading);

    // Fallback observer in case flutter-first-frame fires early or is missed
    var checkInterval = setInterval(function() {
      var view = document.querySelector('flutter-view, flt-glass-pane');
      if (view && view.clientHeight > 0) {
        clearInterval(checkInterval);
        setTimeout(dismissLoading, 150);
      }
    }, 300);

    setTimeout(function() {
      var retryBtn = document.getElementById('loading-retry');
      if (retryBtn) {
        retryBtn.style.display = 'inline-block';
        retryBtn.onclick = function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          window.location.href = window.location.pathname + '?v=' + Date.now() + window.location.hash;
        };
      }
    }, 10000);
  </script>
  <script src="flutter_bootstrap.js?v=20261110" async></script>
</body>
</html>
