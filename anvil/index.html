<!DOCTYPE html>
<html>
<head>
  <!-- Frame-busting clickjacking defense for static hosts (GitHub Pages) -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }
  </script>
  <script src="sublink-guard.js"></script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/anvil/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Where knowledge is forged through learning. Upload lecture notes, chat with a grounded tutor, build flashcards, take quizzes, and track your progress.">
  <meta name="theme-color" content="#5146E5">

  <!-- Content Security Policy for GitHub Pages -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com; connect-src 'self' https: wss: http://localhost:8000; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';">

  <!-- Open Graph -->
  <meta property="og:title" content="Anvil">
  <meta property="og:description" content="Where knowledge is forged through learning. A citation-grounded study companion.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rnl-devdump.github.io">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anvil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anvil</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading indicator while Flutter initializes */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #F4EFE4;
      font-family: 'Inter', system-ui, sans-serif;
      color: #6C6A68;
      flex-direction: column;
      gap: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .loading { background: #0D1014; color: #A7A29A; }
    }
    .loading-spinner {
      width: 28px; height: 28px;
      border: 3px solid #E3DACB;
      border-top-color: #5146E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @media (prefers-color-scheme: dark) {
      .loading-spinner { border-color: #2A3039; border-top-color: #8E88FF; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <span>Loading Anvil…</span>
  </div>

  <script>
    // Restore path after 404.html SPA redirect with boundary verification
    (function() {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('p');
      if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
        try {
          window.history.replaceState(null, '', decodeURIComponent(redirect));
        } catch (_) {}
      }
    })();

    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
